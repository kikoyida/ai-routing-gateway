<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway Console</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #2f81f7;
            --accent-hover: #1f6feb;
            --success: #238636;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header p {
            margin: 8px 0 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .container {
            display: flex;
            gap: 30px;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            width: 50%;
        }

        .panel-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2ea043;
        }

        .btn-secondary {
            background-color: var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #8b949e;
        }

        pre {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 6px;
            overflow-y: auto;
            flex: 1;
            margin: 0;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #e6edf3;
            white-space: pre-wrap;
        }

        .logs-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* 隐藏滚动条让界面更极简 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .log-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .tag {
            background-color: rgba(47, 129, 247, 0.15);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-family: monospace;
            border: 1px solid rgba(47, 129, 247, 0.4);
        }

        .cost {
            color: var(--text-muted);
            font-size: 12px;
            font-family: monospace;
        }

        .log-prompt {
            font-size: 14px;
            color: var(--text-main);
            margin: 0;
        }

        .blinking-cursor::after {
            content: "▋";
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    
    <div class="header">
        <h2>AI Routing Gateway</h2>
        <p>Dynamic Model Dispatcher & Cost Auditing System</p>
    </div>
    
    <div class="container">
        <!-- 左侧：终端调试区 -->
        <div class="panel">
            <h3 class="panel-title">Console / Debug</h3>
            <div class="input-group">
                <input type="text" id="promptInput" placeholder="Enter prompt to test gateway routing..." onkeydown="if(event.key==='Enter') sendRequest()">
                <button onclick="sendRequest()">Execute</button>
            </div>
            <pre id="responseArea">// Ready. Waiting for input...</pre>
        </div>

        <!-- 右侧：数据库监控大盘 -->
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 class="panel-title" style="margin: 0;">Traffic Logs</h3>
                <button class="btn-secondary" onclick="fetchLogs()" style="padding: 6px 12px; font-size: 12px;">Refresh</button>
            </div>
            <div class="logs-area" id="logsArea">
                <!-- 历史记录会通过 JS 动态插入 -->
            </div>
        </div>
    </div>

    <script>
        async function sendRequest() {
            const prompt = document.getElementById('promptInput').value;
            if (!prompt) return;
            
            const responseArea = document.getElementById('responseArea');
            // 去掉了表情，加上了极客风的光标闪烁动画
            responseArea.innerHTML = "<span class='blinking-cursor'>Connecting to gateway...</span>";

            try {
                const response = await fetch('http://127.0.0.1:8000/api/gateway', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                if (!response.ok) throw new Error("Gateway Connection Error");

                const modelName = response.headers.get("X-Target-Model");
                responseArea.innerText = `[System] Routed to ${modelName}\n[System] Receiving stream...\n\n`;

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break; 
                    responseArea.innerText += decoder.decode(value, {stream: true});
                }
                
                fetchLogs();
                
            } catch (error) {
                responseArea.innerText = "[Exception] " + error;
            }
        }

        async function fetchLogs() {
            const response = await fetch('http://127.0.0.1:8000/api/logs');
            const data = await response.json();
            let html = '';
            data.history.reverse().forEach(log => {
                html += `
                <div class="log-item">
                    <div class="log-meta">
                        <span class="tag">${log.selected_model}</span>
                        <span class="cost">Cost: $${log.cost}</span>
                    </div>
                    <p class="log-prompt">${log.original_prompt}</p>
                </div>`;
            });
            document.getElementById('logsArea').innerHTML = html;
        }

        fetchLogs();
    </script>
</body>
</html>
